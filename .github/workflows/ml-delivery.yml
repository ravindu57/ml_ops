name: ML Delivery

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.name.outputs.image_name }}
      image_tag: ${{ steps.name.outputs.image_tag }}
      source_sha: ${{ steps.name.outputs.source_sha }}
      image_ref: ${{ steps.build_ref.outputs.image_ref }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Choose lowercase image name
        id: name
        shell: bash
        run: |
          set -euo pipefail
          # Registry paths must be lowercase; ${VAR,,} lowercases the value.
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="sha-${GITHUB_SHA}"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${image_name}:${image_tag}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image_name }}:${{ steps.name.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=iris-prediction

      - name: Expose immutable digest reference
        id: build_ref
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "build-push-action produced no digest" >&2
            exit 1
          fi
          image_ref="${{ steps.name.outputs.image_name }}@${digest}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}"
