name: ML Delivery

on:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and publish multi-arch image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_name: ${{ steps.name.outputs.image_name }}
      image_tag: ${{ steps.name.outputs.image_tag }}
      source_sha: ${{ steps.name.outputs.source_sha }}
      image_ref: ${{ steps.build_ref.outputs.image_ref }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Choose lowercase image name
        id: name
        shell: bash
        run: |
          set -euo pipefail
          # Registry paths must be lowercase; ${VAR,,} lowercases the value.
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          image_tag="sha-${GITHUB_SHA}"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${image_name}:${image_tag}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.name.outputs.image_name }}:${{ steps.name.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=iris-prediction

      - name: Expose immutable digest reference
        id: build_ref
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "build-push-action produced no digest" >&2
            exit 1
          fi
          image_ref="${{ steps.name.outputs.image_name }}@${digest}"
          echo "image_ref=${image_ref}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${image_ref}"

  load_test:
    name: Smoke and load gate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Locust
        run: python -m pip install "locust>=2.32,<3"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the exact digest built by this run
        run: |
          set -euo pipefail
          image_ref="${{ needs.build.outputs.image_ref }}"
          echo "Testing ${image_ref}"
          docker pull "$image_ref"

      - name: Start staging container
        run: |
          set -euo pipefail
          docker run -d --name iris-staging -p 127.0.0.1:5000:5000 \
            "${{ needs.build.outputs.image_ref }}"

      - name: Run smoke checks
        run: python scripts/smoke.py http://127.0.0.1:5000

      - name: Run headless load gate (20 users, 5/s, 60s)
        run: |
          set -euo pipefail
          mkdir -p reports
          locust -f locustfile.py --headless \
            --host http://127.0.0.1:5000 \
            -u 20 -r 5 -t 60s --stop-timeout 5 \
            --csv reports/staging-load --html reports/staging-load.html

      - name: Upload load reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-reports-${{ github.sha }}
          path: reports/
          if-no-files-found: warn

      - name: Show staging container logs
        if: always()
        run: docker logs iris-staging || true

      - name: Remove staging container
        if: always()
        run: docker rm -f iris-staging || true
